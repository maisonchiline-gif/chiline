<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хронология Композиторов</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <button id="btn-show-menu">Меню</button>

    <div id="ui-layer" class="ui-hidden">
        <button id="btn-close-menu">✖</button> 
        <h1>Композиторов — <span id="total-count">0</span></h1>

        <div class="filter-group">
            <label>Вид отображения:</label>
            <select id="ctrl-layout">
                <option value="compact">Компактный</option>
                <option value="linear">Построчный</option>
            </select>
        </div>

        <div class="filter-group">
            <label>Сортировка (построение):</label>
            <select id="ctrl-sort">
                <option value="birth">По году рождения</option>
                <option value="death">По году смерти</option>
                <option value="lifespan">По продолжительности жизни</option>
                <option value="country">По странам (Группировка)</option>
            </select>
        </div>

        <div class="filter-group">
            <label>🎨 Расцветка:</label>
            <select id="ctrl-color">
                <option value="era">По эпохам</option>
                <option value="country">По странам</option>
            </select>
        </div>

        <div class="filter-group">
            <div class="filter-header">
                <label>Эпоха:</label>
                <a href="#" class="toggle-all" data-target="ctrl-era">Вкл/Выкл все</a>
            </div>
            <div id="ctrl-era" class="checkbox-container"></div>
        </div>

        <div class="filter-group">
            <div class="filter-header">
                <label>Страна:</label>
                <a href="#" class="toggle-all" data-target="ctrl-country">Вкл/Выкл все</a>
            </div>
            <div id="ctrl-country" class="checkbox-container"></div>
        </div>
        

        <div class="filter-group">
            <label>Возраст: от <span id="val-min-life">0</span> до <span id="val-max-life">120</span> лет</label>
            <input type="range" id="ctrl-min-life" min="0" max="120" value="0">
            <input type="range" id="ctrl-max-life" min="0" max="120" value="120" style="margin-top: 5px;">
        </div>
        
        <div class="filter-group">
            <label>Длина блоков:</label>
            <input type="range" id="ctrl-width" min="0.1" max="1" step="0.05" value="0.5">
        </div>
    </div>

    <div id="viewport" data-zoom="100">
        <div id="canvas">
            <div id="bg-layer"></div>
            <div id="grid-layer"></div>
            <div id="facts-layer"></div>
            <div id="items-layer"></div>
        </div>
    </div>

    <div id="fact-card">
        <div class="fact-year" id="fact-card-year"></div>
        <h3 id="fact-card-title"></h3>
        <p id="fact-card-text"></p>
    </div>

    <div id="facts-nav">
        <button class="nav-btn" id="btn-prev-fact">⬅ В прошлое</button>
        <div id="fact-info-display">Режим композиторов</div>
        <button class="nav-btn" id="btn-next-fact">В будущее ➡</button>
        <button class="nav-btn" id="btn-jump-composers">К композиторам</button>
    </div>
    

    <div id="tooltip"></div>

    <div id="social-links">
    <a href="#" class="social-btn ozon" target="_blank" title="Ozon">Ozon</a>
    <a href="#" class="social-btn boosty" target="_blank" title="Boosty">Boosty</a>
    <a href="#" class="social-btn telegram" target="_blank" title="Telegram">Telegram</a>
    <a href="#" class="social-btn instagram" target="_blank" title="Instagram">Instagram</a>
    <a href="#" class="social-btn youtube" target="_blank" title="YouTube">YouTube</a>
    <a href="#" class="social-btn donate" target="_blank" title="Поддержать проект">Донат</a>
</div>

    <script src="script.js"></script>
</body>

</html>
