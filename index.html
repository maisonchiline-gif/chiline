<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHILINE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #fff; color: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; }
        header { text-align: center; margin: 15vh 0 8vh; }
        .brand-title { font-size: 2.2rem; font-weight: 300; letter-spacing: 0.5em; text-transform: uppercase; text-indent: 0.5em; }
        
        main { width: 100%; max-width: 700px; border-inline: 1px solid #000; padding: 0 40px; }
        .row { width: 100%; }
        
        .trigger { display: flex; justify-content: space-between; align-items: baseline; padding: 20px 0; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
        .row-title { font-size: 1.05rem; font-weight: 400; letter-spacing: 0.1em; text-transform: uppercase; }
        .trigger-right { display: flex; align-items: baseline; gap: 20px; }
        
        .row-meta { font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; color: #999; transition: color 0.3s linear; }
        .icon { width: 18px; height: 18px; color: #999; position: relative; top: 2px; transition: color 0.3s linear, transform 0.3s linear; }
        
        .trigger:hover .row-meta, .trigger:hover .icon { color: #000; }
        .row.is-open .icon { transform: rotate(45deg); color: #000; }

        .content { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.3s linear; }
        .row.is-open .content { grid-template-rows: 1fr; }
        .inner { overflow: hidden; opacity: 0; transition: opacity 0.2s linear; }
        .row.is-open .inner { opacity: 1; transition: opacity 0.3s linear; }
        
        .links { padding: 0 0 30px 20px; display: flex; flex-direction: column; gap: 16px; }
        .sub-link { font-size: 0.8rem; letter-spacing: 0.15em; text-transform: uppercase; color: #666; text-decoration: none; width: fit-content; transition: color 0.2s ease; }
        .sub-link:hover { color: #000; }

        footer { margin-top: auto; padding-top: 8vh; }
        .footer-mark { font-size: 0.7rem; letter-spacing: 0.4em; color: #bcb; }

        /* Закрытый раздел (Форма ввода) */
        .secret-box { 
            display: flex; align-items: baseline; gap: 15px; 
            position: relative; /* Делаем блок якорем для всплывающей ошибки */
        }
        #pass-input { 
            background: transparent; border: none; border-bottom: 1px solid #ccc; 
            color: #000; font-family: inherit; font-size: 0.75rem; letter-spacing: 0.2em; 
            padding: 5px 0; outline: none; width: 140px; text-transform: uppercase; 
            transition: border-color 0.3s; border-radius: 0;
        }
        #pass-input:focus { border-bottom: 1px solid #000; }
        #pass-input::placeholder { color: #ccc; }
        
        .secret-btn { 
            font-size: 0.75rem; letter-spacing: 0.15em; color: #999; 
            cursor: pointer; transition: color 0.2s; 
        }
        .secret-btn:hover { color: #000; }
        
        .pass-error { 
            position: absolute; /* МАГИЯ: Вырываем текст из физического пространства */
            top: 100%; left: 0; /* Привязываем строго под линией инпута */
            font-size: 0.65rem; color: #999; letter-spacing: 0.1em; 
            text-transform: uppercase; margin-top: 8px; 
            opacity: 0; transition: opacity 0.2s; pointer-events: none; 
        }

        @media (max-width: 600px) { main { padding: 0 20px; } .row-meta { display: none; } }
    </style>
</head>
<body>
    <audio id="ambient-music" src="background/background.mp3" loop preload="auto"></audio>
    <header>
        <h1 class="brand-title">Chiline</h1>
    </header>

    <main>
        <div class="row">
            <div class="trigger">
                <span class="row-title">Гармония</span>
                <div class="trigger-right">
                    <span class="row-meta">Система / 01</span>
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M12 4v16m-8-8h16" /></svg>
                </div>
            </div>
            <div class="content"><div class="inner"><div class="links">
                <a href="circle/" class="sub-link">квинтовый круг</a>
                <a href="circle/" class="sub-link">квинтовый квадрат</a>
            </div></div></div>
        </div>

        <div class="row">
            <div class="trigger">
                <span class="row-title">Как слушать музыку</span>
                <div class="trigger-right">
                    <span class="row-meta">Книги / 02</span>
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M12 4v16m-8-8h16" /></svg>
                </div>
            </div>
            <div class="content"><div class="inner"><div class="links">
                <a href="rachmaninoff_op._18/" class="sub-link">Выпуск 1: Рахманинов (Op. 18)</a>
            </div></div></div>
        </div>

        <div class="row">
            <div class="trigger">
                <span class="row-title">Таймлайн с композиторами</span>
                <div class="trigger-right">
                    <span class="row-meta">История / 03</span>
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M12 4v16m-8-8h16" /></svg>
                </div>
            </div>
            <div class="content"><div class="inner"><div class="links">
                
                <div class="secret-box">
                    <input type="password" id="pass-input" placeholder="КОД ДОСТУПА" autocomplete="off">
                    <span class="secret-btn" id="pass-btn">ВВОД</span>
                </div>
                <div id="pass-error" class="pass-error">В доступе отказано</div>

            </div></div></div>
        </div>
    </main>

    <footer>
        <span class="footer-mark">MDXXVI</span>
    </footer>
    <audio id="ambient-music" src="background/background.mp3" loop preload="auto"></audio>
    <script>
        // Секретный доступ к Таймлайну
        const passInput = document.getElementById('pass-input');
        const passBtn = document.getElementById('pass-btn');
        const passError = document.getElementById('pass-error');

        const checkCode = () => {
            // ЗДЕСЬ УКАЗЫВАЕТСЯ ПАРОЛЬ (обязательно заглавными буквами)
            if (passInput.value.toUpperCase() === '12345') {
                window.location.href = 'timeline/'; // Перенаправление в папку
            } else {
                // Если пароль неверный
                passError.style.opacity = '1';
                setTimeout(() => passError.style.opacity = '0', 2000);
                passInput.value = ''; // Очищаем поле
            }
        };

        // --- ФОНОВАЯ МУЗЫКА ---
        const ambientAudio = document.getElementById('ambient-music');
        
        // Устанавливаем громкость (0.15 = 15%. Значение 1.0 = 100%)
        ambientAudio.volume = 0.15; 

        // Функция запуска
        const startAmbient = () => {
            // Пытаемся запустить музыку
            ambientAudio.play().catch(() => {
                // Если браузер все еще блокирует, ничего не делаем, ждем следующего клика
            });
            
            // Если музыка заиграла, удаляем этот "слушатель", чтобы команда не повторялась
            if (!ambientAudio.paused) {
                document.removeEventListener('click', startAmbient);
            }
        };

        // Ловим самый первый клик пользователя в ЛЮБОМ месте страницы
        document.addEventListener('click', startAmbient);

        // Запуск проверки по клику на "ВВОД" или по нажатию Enter на клавиатуре
        if(passBtn && passInput) {
            passBtn.addEventListener('click', checkCode);
            passInput.addEventListener('keypress', e => { 
                if (e.key === 'Enter') checkCode(); 
            });
        }
        document.addEventListener('click', e => {
            let t = e.target.closest('.trigger');
            if (!t) return;
            let r = t.parentNode;
            [...r.parentNode.children].forEach(s => s !== r && s.classList.remove('is-open'));
            r.classList.toggle('is-open');
        });
    </script>

</body>
</html>
