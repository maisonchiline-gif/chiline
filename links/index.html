    <div class="toast" id="toastMsg">Ссылка скопирована!</div>

    <script>
        function toggleDropdown(btn) {
    const currentDropdown = btn.parentElement;
    // Запоминаем, был ли открыт список, по которому мы кликнули
    const isCurrentlyActive = currentDropdown.classList.contains('active');

    // 1. Принудительно закрываем ВСЕ списки на странице
    document.querySelectorAll('.dropdown').forEach(dropdown => {
        dropdown.classList.remove('active');
        dropdown.querySelector('.btn-toggle').setAttribute('aria-expanded', 'false');
    });

    // 2. Если тот, на который кликнули, был закрыт — открываем его
    if (!isCurrentlyActive) {
        currentDropdown.classList.add('active');
        btn.setAttribute('aria-expanded', 'true');
    }
}

        const shareBtn = document.getElementById('shareBtn');
        const toast = document.getElementById('toastMsg');
        let isSharing = false;

        shareBtn.addEventListener('click', async () => {
            if (isSharing) return;
            const url = location.href;

            if (navigator.share) {
                isSharing = true;
                try {
                    await navigator.share({ title: document.title, url });
                } catch (e) { 
                    // Ignore abort errors
                } finally { 
                    isSharing = false; 
                }
                return;
            }

            try {
                await navigator.clipboard.writeText(url);
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2000);
            } catch (e) {
                alert('Ссылка на профиль: ' + url);
            }
        });
    </script>
