        <button class="share" id="shareBtn"><i class="fa-solid fa-arrow-up-from-bracket" aria-hidden="true"></i>
            Поделиться профилем</button>
    </div>

    <div class="toast" id="toastMsg">Ссылка скопирована!</div>

    <script>
        function toggleDropdown(element) {
            const dropdown = element.parentElement;
            dropdown.classList.toggle('active');
        }

        const shareBtn = document.getElementById('shareBtn'), toast = document.getElementById('toastMsg');
        let isSharing = false;

        shareBtn.onclick = async () => {
            if (isSharing) return;
            const url = location.href;

            if (navigator.share) {
                isSharing = true;
                try {
                    await navigator.share({ title: document.title, url });
                } catch { } finally { isSharing = false; }
                return;
            }

            try {
                await navigator.clipboard.writeText(url);
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2000);
            } catch {
                alert('Ссылка на профиль: ' + url);
            }
        };


    </script>
