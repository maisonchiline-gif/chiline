<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHILINE / Аудиогид</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: #fff; color: #000; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; 
            height: 100vh; height: 100dvh; /* Защита от прыгающей адресной строки на iOS/Android */
            overflow: hidden; display: flex; flex-direction: column; 
            align-items: center; justify-content: flex-start; padding: 20px; 
        }
        
        /* Плавающие колонтитулы */
        .fixed-mark { position: fixed; left: 0; width: 100%; text-align: center; font-size: 0.7rem; letter-spacing: 0.4em; text-transform: uppercase; color: #bcb; z-index: 100; pointer-events: none; }
        .top-mark { top: 40px; }
        .bottom-mark { bottom: 40px; }

        header { text-align: center; margin: 12vh 0 6vh; }
        .brand-title { font-size: 2rem; font-weight: 300; letter-spacing: 0.5em; text-transform: uppercase; text-indent: 0.5em; }
        .subtitle { font-size: 0.65rem; letter-spacing: 0.4em; text-transform: uppercase; color: #999; margin-top: 15px; }
        
        main { width: 100%; max-width: 600px; }

        /* Навигация и выпадающий список */
        .track-nav { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid #000; padding-bottom: 20px; margin-bottom: 20px; }
        .nav-btn, .tc { font-size: 0.8rem; letter-spacing: 0.2em; text-transform: uppercase; color: #999; cursor: pointer; transition: color 0.2s; }
        .nav-btn:hover, .tc:hover { color: #000; }
        .nav-btn.disabled { opacity: 0.2; pointer-events: none; }
        
        .track-selector { position: relative; flex-grow: 1; text-align: center; }
        .title-wrapper { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; transition: opacity 0.2s; }
        .title-wrapper:hover { opacity: 0.6; }
        .track-title { font-size: 1.05rem; font-weight: 400; letter-spacing: 0.1em; text-transform: uppercase; }
        
        .title-wrapper .icon { width: 14px; height: 14px; transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1); }
        .title-wrapper.is-open .icon { transform: rotate(180deg); }
        
        /* Выпадающее меню с кроссбраузерным тонким скроллом */
        .dropdown { 
            position: absolute; top: 100%; left: 50%; transform: translateX(-50%); 
            background: #fff; border: 1px solid #000; width: 100%; max-width: 320px; 
            margin-top: 15px; opacity: 0; visibility: hidden; transition: all 0.2s ease; z-index: 10; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); max-height: 40vh; overflow-y: auto;
            scrollbar-width: thin; scrollbar-color: #e0e0e0 transparent;
        }
        .title-wrapper.is-open + .dropdown { opacity: 1; visibility: visible; margin-top: 8px; }
        .dropdown::-webkit-scrollbar { width: 3px; }
        .dropdown::-webkit-scrollbar-thumb { background: #e0e0e0; }
        
        .drop-item { padding: 12px 20px; font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; color: #666; cursor: pointer; border-bottom: 1px solid #eee; text-align: left; }
        .drop-item:last-child { border-bottom: none; }
        .drop-item:hover { background: #fafafa; color: #000; }
        .drop-item.active { background: #000; color: #fff; }

        /* Плеер */
        .player { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; }
        .play-btn { font-size: 0.8rem; font-weight: 500; letter-spacing: 0.2em; cursor: pointer; width: 60px; color: #000; }
        .tl-hitbox { flex-grow: 1; padding: 15px 0; cursor: pointer; position: relative; display: flex; align-items: center; }
        .tl-line { height: 1px; background: #e0e0e0; width: 100%; position: relative; }
        .tl-prog { height: 3px; background: #000; position: absolute; top: -1px; left: 0; width: 0%; pointer-events: none; transition: width 0.1s linear; }
        .time-val { font-size: 0.7rem; letter-spacing: 0.1em; color: #999; width: 45px; text-align: right; font-variant-numeric: tabular-nums; }

        /* Таймкоды */
        .timecodes-container { display: flex; flex-direction: column; gap: 12px; max-height: 35vh; overflow-y: auto; padding-right: 10px; scrollbar-width: thin; scrollbar-color: #e0e0e0 transparent; }
        .timecodes-container::-webkit-scrollbar { width: 3px; }
        .timecodes-container::-webkit-scrollbar-thumb { background: #e0e0e0; }
        .tc { width: fit-content; }
        .tc-time { color: #999; margin-right: 15px; }
    </style>
</head>
<body>
    <div class="fixed-mark top-mark">Как слушать музыку</div>
    
    <header>
        <h1 class="brand-title">Рахманинов</h1>
        <div class="subtitle">Op. 18</div>
    </header>

    <main>
        <div class="track-nav">
            <div class="nav-btn" id="btn-prev">Назад</div>
            <div class="track-selector">
                <div class="title-wrapper" id="dropdown-trigger">
                    <span class="track-title" id="ui-title">Загрузка...</span>
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 9l6 6 6-6" /></svg>
                </div>
                <div class="dropdown" id="dropdown-list"></div>
            </div>
            <div class="nav-btn" id="btn-next">Далее</div>
        </div>

        <div class="player">
            <div class="play-btn" id="btn-play">PLAY</div>
            <div class="tl-hitbox" id="timeline">
                <div class="tl-line"><div class="tl-prog" id="progress"></div></div>
            </div>
            <div class="time-val" id="time-display">0:00</div>
        </div>

        <div class="timecodes-container" id="timecodes-box"></div>
    </main>

    <div class="fixed-mark bottom-mark">MDXXVI</div>
    <audio id="audio-engine" preload="metadata"></audio>

    <script>
        /* БАЗА ДАННЫХ ПЛЕЙЛИСТА */
        const playlist = [
            { title: "1.1 / Картина 01 / Часть I", file: "mp3/1.1.mp3", timecodes: [{time:0, label:"Начало. Имитация колоколов"}, {time:15, label:"Вступление оркестра"}, {time:45, label:"Главная партия фортепиано"}] },
            { title: "1.2 / Картина 02 / Часть I", file: "mp3/1.2.mp3", timecodes: [{time:0, label:"Переходная часть"}, {time:120, label:"Побочная партия (Лирика)"}, {time:240, label:"Разработка темы"}] },
            { title: "1.3 / Картина 03 / Часть I", file: "mp3/1.3.mp3", timecodes: [{time:0, label:"Мощные аккорды"}, {time:60, label:"Кода и завершение"}] },
            { title: "1.4 / Картина 04 / Часть I", file: "mp3/1.2.mp3", timecodes: [{time:0, label:"Переходная часть"}, {time:120, label:"Побочная партия (Лирика)"}, {time:240, label:"Разработка темы"}] },
            { title: "1.5 / Картина 05 / Часть I", file: "mp3/1.3.mp3", timecodes: [{time:0, label:"Мощные аккорды"}, {time:60, label:"Кода и завершение"}] },
            { title: "1.6 / Картина 06 / Часть I", file: "mp3/1.2.mp3", timecodes: [{time:0, label:"Переходная часть"}, {time:120, label:"Побочная партия (Лирика)"}, {time:240, label:"Разработка темы"}] },
            { title: "1.7 / Картина 07 / Часть I ", file: "mp3/1.3.mp3", timecodes: [{time:0, label:"Мощные аккорды"}, {time:60, label:"Кода и завершение"}] },
            { title: "2.1 / Картина 01 / Часть II", file: "mp3/1.2.mp3", timecodes: [{time:0, label:"Переходная часть"}, {time:120, label:"Побочная партия (Лирика)"}, {time:240, label:"Разработка темы"}] },
            { title: "2.2 / Картина 02 / Часть II", file: "mp3/1.3.mp3", timecodes: [{time:0, label:"Мощные аккорды"}, {time:60, label:"Кода и завершение"}] },
            { title: "2.3 / Картина 03 / Часть II", file: "mp3/1.2.mp3", timecodes: [{time:0, label:"Переходная часть"}, {time:120, label:"Побочная партия (Лирика)"}, {time:240, label:"Разработка темы"}] },
            { title: "2.4 / Картина 04 / Часть II", file: "mp3/1.3.mp3", timecodes: [{time:0, label:"Мощные аккорды"}, {time:60, label:"Кода и завершение"}] },
            { title: "3.1 / Картина 01 / Часть III", file: "mp3/1.2.mp3", timecodes: [{time:0, label:"Переходная часть"}, {time:120, label:"Побочная партия (Лирика)"}, {time:240, label:"Разработка темы"}] },
            { title: "3.2 / Картина 02 / Часть III", file: "mp3/1.3.mp3", timecodes: [{time:0, label:"Мощные аккорды"}, {time:60, label:"Кода и завершение"}] },
            { title: "3.3 / Картина 03 / Часть III", file: "mp3/1.3.mp3", timecodes: [{time:0, label:"Мощные аккорды"}, {time:60, label:"Кода и завершение"}] },
            { title: "3.4 / Картина 04 / Часть III", file: "mp3/1.3.mp3", timecodes: [{time:0, label:"Мощные аккорды"}, {time:60, label:"Кода и завершение"}] },
            { title: "3.5 / Картина 05 / Часть III", file: "mp3/1.3.mp3", timecodes: [{time:0, label:"Мощные аккорды"}, {time:60, label:"Кода и завершение"}] },
            { title: "3.6 / Картина 06 / Часть III", file: "mp3/1.3.mp3", timecodes: [{time:0, label:"Мощные аккорды"}, {time:60, label:"Кода и завершение"}] },
            { title: "3.7 / Картина 07 / Часть III", file: "mp3/1.3.mp3", timecodes: [{time:0, label:"Мощные аккорды"}, {time:60, label:"Кода и завершение"}] }
        ];

        /* ЯДРО ПЛЕЕРА */
        const $ = id => document.getElementById(id);
        const audio = $('audio-engine'), title = $('ui-title'), tBox = $('timecodes-box'),
              btnPlay = $('btn-play'), btnP = $('btn-prev'), btnN = $('btn-next'),
              prog = $('progress'), tm = $('time-display'), tl = $('timeline'),
              ddTrig = $('dropdown-trigger'), ddList = $('dropdown-list');
        
        let curIdx = 0;

        // Генерация списка
        ddList.innerHTML = playlist.map((t, i) => `<div class="drop-item" data-idx="${i}">${t.title}</div>`).join('');

        const loadTrack = i => {
            let t = playlist[i];
            audio.src = t.file; title.textContent = t.title;
            [...ddList.children].forEach((el, j) => el.classList.toggle('active', j === i));
            tBox.innerHTML = t.timecodes.map(tc => `<div class="tc" data-sec="${tc.time}"><span class="tc-time">${Math.floor(tc.time/60)}:${(tc.time%60).toString().padStart(2,'0')}</span>${tc.label}</div>`).join('');
            
            btnP.classList.toggle('disabled', i === 0);
            btnN.classList.toggle('disabled', i === playlist.length - 1);
            prog.style.width = '0%'; tm.textContent = '0:00'; btnPlay.textContent = 'PLAY';
            ddTrig.classList.remove('is-open');
        };

        // Взаимодействие
        ddTrig.onclick = e => { e.stopPropagation(); ddTrig.classList.toggle('is-open'); };
        ddList.onclick = e => { let t = e.target.closest('.drop-item'); if(t) { loadTrack(curIdx = +t.dataset.idx); audio.play(); } };
        document.onclick = e => { if(!e.target.closest('.track-selector')) ddTrig.classList.remove('is-open'); };

        btnP.onclick = () => { if(curIdx > 0) { loadTrack(--curIdx); audio.play(); } };
        btnN.onclick = () => { if(curIdx < playlist.length - 1) { loadTrack(++curIdx); audio.play(); } };
        btnPlay.onclick = () => audio.paused ? audio.play() : audio.pause();

        tl.onclick = e => { if(!audio.duration) return; audio.currentTime = (e.clientX - tl.getBoundingClientRect().left) / tl.offsetWidth * audio.duration; if(audio.paused) audio.play(); };
        tBox.onclick = e => { let t = e.target.closest('.tc'); if(t) { audio.currentTime = +t.dataset.sec; audio.play(); } };

        // Синхронизация звука
        audio.onplay = () => btnPlay.textContent = 'PAUSE';
        audio.onpause = () => btnPlay.textContent = 'PLAY';
        audio.onended = () => btnPlay.textContent = 'PLAY';
        audio.ontimeupdate = () => {
            if(!audio.duration) return;
            prog.style.width = (audio.currentTime / audio.duration * 100) + '%';
            tm.textContent = `${Math.floor(audio.currentTime/60)}:${Math.floor(audio.currentTime%60).toString().padStart(2,'0')}`;
        };

        loadTrack(curIdx);
    </script>
</body>
</html>
