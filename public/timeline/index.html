<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#151515">
    <meta name="color-scheme" content="dark">
    <title>Хронология Композиторов</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- ВЕРХНЯЯ ПАНЕЛЬ (ЕДИНЫЙ КОНТУР С ДАТАМИ) -->
    <div id="unified-header">
        
        <!-- 1. МЕНЮ ТЕПЕРЬ СВЕРХУ -->
        <div id="top-bar-inner">
            <button id="btn-jump-composers" class="top-nav-btn icon-btn" title="Отдалить камеру ко всем">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
            </button>
            
            <div class="top-bar-title">Композиторов: <span id="total-count">...</span></div>
            
            <button class="top-nav-btn icon-btn" data-target="drop-filters" title="Сортировка">
                <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                </svg>
            </button>

            <button class="top-nav-btn icon-btn" data-target="drop-appearance" title="Внешний вид">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18.37 2.63a3 3 0 0 1 4.24 4.24l-9.19 9.19a2 2 0 0 1-1.42.59H9v-2.83a2 2 0 0 1 .59-1.41z"></path>
                    <path d="M14 6l4 4"></path>
                    <path d="M9 16.5c-3.21 2.41-6.19 4.5-9 4.5 1.63-2.19 3.09-5.79 5.5-9"></path>
                </svg>
            </button>

            <button id="btn-toggle-facts" class="top-nav-btn icon-btn" title="Факты">
                <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 18h6"></path><path d="M10 22h4"></path>
                    <path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"></path>
                </svg>
            </button>

            <div class="search-container">
                <input type="text" id="ctrl-search" placeholder="Поиск..." autocomplete="off">
                <div id="search-results" class="search-dropdown"></div>
            </div>
        </div>
        <div id="dates-axis"></div>
        
    </div>

    <!-- ПАНЕЛЬ СОРТИРОВКИ -->
    <div id="drop-filters" class="dropdown-panel">
        <div class="filter-group">
            <label for="ctrl-min-life">Возраст: от <span id="val-min-life">0</span> до <span id="val-max-life">120</span> лет</label>
            <div class="dual-slider-wrapper">
                <div class="dual-slider-track" id="track-life"></div>
                <input type="range" id="ctrl-min-life" min="0" max="120" value="0">
                <input type="range" id="ctrl-max-life" min="0" max="120" value="120">
            </div>
        </div>
        <hr style="border: none; border-top: 1px solid color-mix(in srgb, var(--c-txt) 20%, transparent); margin: 15px 0;">
        <div class="filter-group">
            <label for="ctrl-min-works">Произведений: от <span id="val-min-works">0</span> до <span id="val-max-works">1400+</span></label>
            <div class="dual-slider-wrapper">
                <div class="dual-slider-track" id="track-works"></div>
                <input type="range" id="ctrl-min-works" min="0" max="1400" step="50" value="0">
                <input type="range" id="ctrl-max-works" min="0" max="1400" step="50" value="1400">
            </div>
        </div>
        <hr style="border: none; border-top: 1px solid color-mix(in srgb, var(--c-txt) 20%, transparent); margin: 15px 0;">
        <div class="filter-group">
            <div class="filter-header">
                <span class="filter-label" style="margin:0;">Эпохи:</span>
                <a href="#" class="toggle-all" data-target="ctrl-era">Вкл/Выкл все</a>
            </div>
            <div id="ctrl-era" class="checkbox-container"></div>
        </div>
        <hr style="border: none; border-top: 1px solid color-mix(in srgb, var(--c-txt) 20%, transparent); margin: 15px 0;">
        <div class="filter-group">
            <div class="filter-header">
                <span class="filter-label" style="margin:0;">Страны:</span>
                <a href="#" class="toggle-all" data-target="ctrl-country">Вкл/Выкл все</a>
            </div>
            <div id="ctrl-country" class="checkbox-container"></div>
        </div>
    </div>

    <!-- ПАНЕЛЬ ВНЕШНЕГО ВИДА + ЭКСПОРТ -->
    <div id="drop-appearance" class="dropdown-panel">
        
        <!-- ГЛАВНЫЙ РУБИЛЬНИК -->
        <div class="filter-group">
            <span class="filter-label">Режим отображения:</span>
            <div class="toggle-switch" id="ctrl-main-mode">
                <button class="switch-btn active" data-val="timeline">Таймлайн</button>
                <button class="switch-btn" data-val="rating">Рейтинг</button>
            </div>
        </div>

        <!-- ВЕТКА 1: ТАЙМЛАЙН -->
        <div id="branch-timeline">
            <div class="filter-group">
                <span class="filter-label">Компоновка:</span>
                <div class="toggle-switch" id="ctrl-timeline-layout">
                    <button class="switch-btn active" data-val="compact">Компактно</button>
                    <button class="switch-btn" data-val="linear">Списком</button>
                </div>
            </div>
            <div class="filter-group">
                <span class="filter-label">Группировка:</span>
                <div class="toggle-switch" id="ctrl-timeline-grouping">
                    <button class="switch-btn active" data-val="none">Общая</button>
                    <button class="switch-btn" data-val="country">По странам</button>
                </div>
            </div>
            <div class="filter-group">
                <span class="filter-label">Сортировка:</span>
                <div class="toggle-switch" id="ctrl-timeline-sort">
                    <button class="switch-btn active" data-val="birth">Рождение</button>
                    <button class="switch-btn" data-val="death">Смерть</button>
                </div>
            </div>
        </div>

        <!-- ВЕТКА 2: РЕЙТИНГ (СТАТИСТИКА) -->
        <div id="branch-rating" style="display:none;">
            <div class="filter-group">
                <span class="filter-label">Показатель (Ось X):</span>
                <div class="toggle-switch toggle-switch-col" id="ctrl-rating-metric">
                    <button class="switch-btn active" data-val="bar_works">Произведения</button>
                    <button class="switch-btn" data-val="bar_age">Годы жизни</button>
                    <button class="switch-btn" data-val="bar_productivity">Продуктивность</button>
                </div>
            </div>
            <div class="filter-group">
                <span class="filter-label">Группировка:</span>
                <div class="toggle-switch toggle-switch-col" id="ctrl-rating-grouping">
                    <button class="switch-btn active" data-val="none">Общая</button>
                    <button class="switch-btn" data-val="country">По странам</button>
                    <button class="switch-btn" data-val="era">По эпохам</button>
                </div>
            </div>
        </div>

        <!-- ОБЩИЕ НАСТРОЙКИ -->
        <hr style="border: none; border-top: 1px solid color-mix(in srgb, var(--c-txt) 20%, transparent); margin: 15px 0;">
        
        <div class="filter-group">
            <span class="filter-label">Расцветка:</span>
            <div class="toggle-switch" id="ctrl-color">
                <button class="switch-btn active" data-val="era">Эпохи</button>
                <button class="switch-btn" data-val="country">Страны</button>
            </div>
        </div>
        <!-- ПОЛЗУНОК МАСШТАБА ОТ -5 ДО +5 -->
        <div class="filter-group">
            <label for="ctrl-width">Масштаб блоков:</label>
            <input type="range" id="ctrl-width" min="-5" max="5" step="1" value="0">
        </div>
        
        <!-- КНОПКА ЭКСПОРТА (В СТИЛЕ ПЕРЕКЛЮЧАТЕЛЕЙ) -->
        <div class="toggle-switch" style="margin-top: 15px;">
            <button id="btn-export-svg" class="action-btn">Экспорт в SVG</button>
        </div>
    </div>

    <!-- ЕДИНЫЙ ХОЛСТ -->
    <div id="viewport">
        <canvas id="main-canvas"></canvas>
    </div>

    <!-- UI ФАКТОВ И ТУЛТИПОВ -->
    <div id="fact-card">
        <button id="btn-close-fact" style="position:absolute; top:12px; right:15px; background:none; border:none; color:#aaa; font-size:18px; cursor:pointer;">✖</button>
        <div class="fact-year" id="fact-card-year"></div>
        <h3 id="fact-card-title"></h3>
        <p id="fact-card-text"></p>
    </div>

    <div id="facts-nav">
        <button class="action-btn nav-btn-square" id="btn-first-fact" title="К первому факту">≪</button>
        <button class="action-btn" id="btn-prev-fact">⬅ В прошлое</button>
        <div id="fact-info-display">Режим композиторов</div>
        <button class="action-btn" id="btn-next-fact">В будущее ➡</button>
        <button class="action-btn nav-btn-square" id="btn-last-fact" title="В наше время">≫</button>
    </div>
    
    <div id="tooltip"></div>

    <!-- ПОДКЛЮЧЕНИЕ СКРИПТОВ -->
    <script type="module" src="data.js"></script>
    <script type="module" src="layout.js"></script>
    <script type="module" src="camera.js"></script>
    <script type="module" src="spatial.js"></script>
    <script type="module" src="renderer.js"></script>
    <script type="module" src="main.js"></script>
</body>
</html>
