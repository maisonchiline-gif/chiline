<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хронология Композиторов</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
    <div id="top-bar">
        <!-- Кнопка отдаления камеры (лупа с минусом) -->
        <button id="btn-jump-composers" class="top-nav-btn icon-btn" title="Отдалить камеру ко всем">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
    <polyline points="9 22 9 12 15 12 15 22"></polyline>
</svg>
        </button>
        
        <div class="top-bar-title">Композиторов: <span id="total-count">0</span></div>
        
        <!-- Кнопка "Сортировка" (Воронка фильтра) -->
        <button class="top-nav-btn icon-btn" data-target="drop-filters" title="Сортировка">
            <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
            </svg>
        </button>

        <!-- Кнопка "Внешний вид" (Сетка/Лэйаут) -->
        <button class="top-nav-btn icon-btn" data-target="drop-appearance" title="Внешний вид">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18.37 2.63a3 3 0 0 1 4.24 4.24l-9.19 9.19a2 2 0 0 1-1.42.59H9v-2.83a2 2 0 0 1 .59-1.41z"></path>
                <path d="M14 6l4 4"></path>
                <path d="M9 16.5c-3.21 2.41-6.19 4.5-9 4.5 1.63-2.19 3.09-5.79 5.5-9"></path>
            </svg>
        </button>

        <!-- Кнопка "Факты" (Лампочка) -->
        <button id="btn-toggle-facts" class="top-nav-btn icon-btn" title="Факты">
            <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 18h6"></path><path d="M10 22h4"></path>
                <path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"></path>
            </svg>
        </button>

        <!-- Поиск -->
        <div class="search-container">
            <input type="text" id="ctrl-search" placeholder="Поиск..." autocomplete="off">
        </div>
    </div> <!-- КОНЕЦ ВЕРХНЕЙ ПАНЕЛИ -->

    <!-- КОНТЕЙНЕР РЕЗУЛЬТАТОВ ПОИСКА -->
    <div id="search-results" class="search-dropdown"></div>

    <!-- 2) ОБЪЕДИНЕННАЯ ПАНЕЛЬ СОРТИРОВКИ -->
    <div id="drop-filters" class="dropdown-panel">
        
        <!-- ФИЛЬТР ВОЗРАСТА -->
        <div class="filter-group">
            <label>Возраст: от <span id="val-min-life">0</span> до <span id="val-max-life">120</span> лет</label>
            <div class="dual-slider-wrapper">
                <div class="dual-slider-track" id="track-life"></div>
                <input type="range" id="ctrl-min-life" min="0" max="120" value="0">
                <input type="range" id="ctrl-max-life" min="0" max="120" value="120">
            </div>
        </div>

        <hr style="border: none; border-top: 1px solid color-mix(in srgb, var(--c-txt) 20%, transparent); margin: 15px 0;">
        
        <!-- ФИЛЬТР ПРОИЗВЕДЕНИЙ -->
        <div class="filter-group">
            <label>Произведений: от <span id="val-min-works">0</span> до <span id="val-max-works">1400+</span></label>
            <div class="dual-slider-wrapper">
                <div class="dual-slider-track" id="track-works"></div>
                <input type="range" id="ctrl-min-works" min="0" max="1400" step="50" value="0">
                <input type="range" id="ctrl-max-works" min="0" max="1400" step="50" value="1400">
            </div>
        </div>

        <hr style="border: none; border-top: 1px solid color-mix(in srgb, var(--c-txt) 20%, transparent); margin: 15px 0;">
        
        <!-- Далее идут Эпохи и Страны без изменений... -->
        
        <div class="filter-group">
            <div class="filter-header">
                <label style="margin:0;">Эпохи:</label>
                <a href="#" class="toggle-all" data-target="ctrl-era">Вкл/Выкл все</a>
            </div>
            <div id="ctrl-era" class="checkbox-container"></div>
        </div>
        <hr style="border: none; border-top: 1px solid color-mix(in srgb, var(--c-txt) 20%, transparent); margin: 15px 0;">
        <div class="filter-group">
            <div class="filter-header">
                <label style="margin:0;">Страны:</label>
                <a href="#" class="toggle-all" data-target="ctrl-country">Вкл/Выкл все</a>
            </div>
            <div id="ctrl-country" class="checkbox-container"></div>
        </div>
    </div>

    <!-- ПАНЕЛЬ ВНЕШНЕГО ВИДА + ЭКСПОРТ -->
    <div id="drop-appearance" class="dropdown-panel">
        <div class="filter-group">
            <label>Вид отображения:</label>
            <select id="ctrl-layout">
                <option value="compact">Компактный</option>
                <option value="linear">Построчный</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Построение графа:</label>
            <select id="ctrl-sort">
                <option value="birth">По году рождения</option>
                <option value="death">По году смерти</option>
                <option value="lifespan">По продолжительности жизни</option>
                <option value="country">По странам (Группировка)</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Расцветка:</label>
            <select id="ctrl-color">
                <option value="era">По эпохам</option>
                <option value="country">По странам</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Длина блоков:</label>
            <input type="range" id="ctrl-width" min="0.1" max="1" step="0.05" value="0.5">
        </div>
        
        <!-- 3) Кнопка Экспорта в SVG -->
        <button id="btn-export-svg" class="top-nav-btn" style="width: 100%; text-align: center; margin-top: 10px; border-color: var(--c-txt); color: var(--c-txt);">Экспорт в SVG</button>
    </div>

    <div id="drop-countries" class="dropdown-panel">
        <div class="filter-group">
            <div class="filter-header">
                <a href="#" class="toggle-all" data-target="ctrl-country">Вкл/Выкл все</a>
            </div>
            <div id="ctrl-country" class="checkbox-container"></div>
        </div>
    </div>

    <div id="drop-lifespan" class="dropdown-panel">
        <div class="filter-group">
            <label>Возраст: от <span id="val-min-life">0</span> до <span id="val-max-life">120</span> лет</label>
            <input type="range" id="ctrl-min-life" min="0" max="120" value="0">
            <input type="range" id="ctrl-max-life" min="0" max="120" value="120" style="margin-top: 5px;">
        </div>
    </div>

    <div id="drop-appearance" class="dropdown-panel">
        <div class="filter-group">
            <label>Вид отображения:</label>
            <select id="ctrl-layout">
                <option value="compact">Компактный</option>
                <option value="linear">Построчный</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Сортировка (построение):</label>
            <select id="ctrl-sort">
                <option value="birth">По году рождения</option>
                <option value="death">По году смерти</option>
                <option value="lifespan">По продолжительности жизни</option>
                <option value="country">По странам (Группировка)</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Расцветка:</label>
            <select id="ctrl-color">
                <option value="era">По эпохам</option>
                <option value="country">По странам</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Длина блоков:</label>
            <input type="range" id="ctrl-width" min="0.1" max="1" step="0.05" value="0.5">
        </div>
    </div>

    <div id="viewport" data-zoom="100">
        <div id="canvas">
            <div id="bg-layer"></div>
            <div id="grid-layer"></div>
            <div id="facts-layer"></div>
            <div id="items-layer"></div>
        </div>
    </div>

    <div id="fact-card">
    <button id="btn-close-fact" style="position:absolute; top:12px; right:15px; background:none; border:none; color:#aaa; font-size:18px; cursor:pointer;">✖</button>
        <div class="fact-year" id="fact-card-year"></div>
        <h3 id="fact-card-title"></h3>
        <p id="fact-card-text"></p>
    </div>

    <div id="facts-nav">
        <button class="nav-btn" id="btn-prev-fact">⬅ В прошлое</button>
        <div id="fact-info-display">Режим композиторов</div>
        <button class="nav-btn" id="btn-next-fact">В будущее ➡</button>
    </div>
    

    <div id="tooltip"></div>
    <script src="script.js"></script>
</body>

</html>
