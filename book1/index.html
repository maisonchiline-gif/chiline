<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рахманинов Op. 18 — CHILINE</title>
    
    <style>
        /* Базовые стили */
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fff;
            color: #000;
        }

        header {
            padding: 40px 20px 20px;
            text-align: center;
        }
        
        .pre-title {
            font-size: 0.7rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: #999;
            margin-bottom: 25px;
        }
        
        
        .brand-title {
            font-size: 1.2rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            font-weight: 400;
            margin: 0;
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            color: #999;
        }

        .page-container { 
            padding: 20px 20px 40px; 
            max-width: 800px; 
            margin: 0 auto; 
        }
        
        .back-link {
            display: inline-flex; align-items: center; gap: 8px;
            font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase;
            color: #999; text-decoration: none; margin-bottom: 40px;
            transition: color 0.2s ease;
        }
        .back-link:hover { color: #000; }
        .back-link svg { width: 14px; height: 14px; }

        /* Блок навигации по трекам */
        .track-nav { 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid #000; padding-bottom: 20px; margin-bottom: 30px; 
        }
        
        .nav-btn { 
            font-size: 0.8rem; letter-spacing: 0.15em; text-transform: uppercase; 
            color: #666; cursor: pointer; transition: color 0.2s; 
        }
        .nav-btn:hover { color: #000; }
        .nav-btn.disabled { opacity: 0.2; pointer-events: none; }
        
        .track-selector { position: relative; flex-grow: 1; text-align: center; }
        
        .title-wrapper { 
            display: inline-flex; align-items: center; gap: 8px; cursor: pointer; transition: opacity 0.2s; 
        }
        .title-wrapper:hover { opacity: 0.6; }
        .track-title { font-size: 0.9rem; font-weight: 400; letter-spacing: 0.15em; text-transform: uppercase; }
        
        .title-wrapper .icon { width: 14px; height: 14px; transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1); }
        .title-wrapper.is-open .icon { transform: rotate(180deg); }
        
        /* Выпадающее меню */
        .dropdown { 
            position: absolute; top: 100%; left: 50%; transform: translateX(-50%); 
            background: #fff; border: 1px solid #000; width: 100%; max-width: 400px; 
            margin-top: 15px; opacity: 0; visibility: hidden; transition: all 0.2s ease; z-index: 10; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); max-height: 40vh; overflow-y: auto;
            scrollbar-width: thin; scrollbar-color: #ccc transparent;
        }
        .title-wrapper.is-open + .dropdown { opacity: 1; visibility: visible; margin-top: 10px; }
        .dropdown::-webkit-scrollbar { width: 4px; }
        .dropdown::-webkit-scrollbar-thumb { background: #000; }
        
        .drop-item { 
    padding: 15px 20px; font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; 
    color: #333; cursor: pointer; border-bottom: 1px solid #eee; text-align: left; transition: all 0.2s; 
}
        .drop-item:last-child { border-bottom: none; }
        .drop-item:hover { color: #fff; background: #000; border-color: #000; }
        .drop-item.active { color: #000; font-weight: 600; background: #f9f9f9; }
        .drop-item.active:hover { color: #fff; background: #000; }

        /* Плеер */
        .player { display: flex; align-items: center; gap: 20px; margin-bottom: 50px; }
        
        /* Минималистичная кнопка Play */
        .play-btn { 
            font-size: 0.75rem; 
            font-weight: 400; 
            letter-spacing: 0.2em; 
            cursor: pointer; 
            width: 60px; 
            color: #000; 
            transition: opacity 0.2s; 
            text-transform: uppercase;
        }
        .play-btn:hover { opacity: 0.6; }
        
        .tl-hitbox { flex-grow: 1; padding: 15px 0; cursor: pointer; position: relative; display: flex; align-items: center; }
        .tl-line { height: 1px; background: #e0e0e0; width: 100%; position: relative; }
        .tl-prog { height: 2px; background: #000; position: absolute; top: -0.5px; left: 0; width: 0%; pointer-events: none; transition: width 0.1s linear; }
        .time-val { font-size: 0.8rem; letter-spacing: 0.15em; color: #666; width: 50px; text-align: right; font-variant-numeric: tabular-nums; }

        /* Таймкоды */
        .materials-section {
            padding-top: 10px; margin-bottom: 25px; border: none;
        }
        .section-title {
            font-size: 0.8rem; letter-spacing: 0.15em; text-transform: uppercase;
            color: #666; margin-bottom: 20px;
        }

        .timecodes-container { 
            display: flex; flex-direction: column; gap: 10px; 
        }
        .tc { 
            display: flex; align-items: center;
            padding: 15px 20px; border: 1px solid transparent; background: transparent;
            color: #333; text-decoration: none; text-transform: uppercase;
            letter-spacing: 0.1em; font-size: 0.85rem; transition: all 0.2s ease; cursor: pointer;
            border-bottom: 1px solid #eee;
        }
        .tc:last-child { border-bottom: 1px solid transparent; }
        .tc:hover { border: 1px solid #000; background: transparent; color: #000; }
        .tc-time { color: #000; font-weight: 500; margin-right: 20px; min-width: 50px; }

        @media (max-width: 600px) {
            .tc { flex-direction: column; align-items: flex-start; gap: 5px; padding: 12px 15px; }
            .tc-time { margin-right: 0; }
        }
    </style>
</head>
<body>
    <header>
        <div class="pre-title">
            Как слушать музыку
        </div>
        <h1 class="brand-title">Выпуск 1: Рахманинов (Op. 18)</h1>
    </header>

    <main>
        <div class="page-container">
            <a href="/" class="back-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                На главную
            </a>

            <div class="track-nav">
                <div class="nav-btn" id="btn-prev">Назад</div>
                <div class="track-selector">
                    <div class="title-wrapper" id="dropdown-trigger">
                        <span class="track-title" id="ui-title">Загрузка...</span>
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6" /></svg>
                    </div>
                    <div class="dropdown" id="dropdown-list"></div>
                </div>
                <div class="nav-btn" id="btn-next">Далее</div>
            </div>

            <div class="player">
                <div class="play-btn" id="btn-play">PLAY</div>
                <div class="tl-hitbox" id="timeline">
                    <div class="tl-line"><div class="tl-prog" id="progress"></div></div>
                </div>
                <div class="time-val" id="time-display">0:00</div>
            </div>

            <div class="materials-section">
                <div class="section-title">Структура композиции</div>
                <div class="timecodes-container" id="timecodes-box"></div>
            </div>
            
        </div>
    </main>

    <footer>
        <span class="footer-mark">CHILINE</span>
    </footer>

    <audio id="audio-engine" preload="metadata"></audio>

    <script>
        const playlist = [
    { 
        title: "1-я картина: вступление", 
        file: "mp3/1.1.mp3", 
        timecodes: [
            {time: 0, label: "Восемь ударов (призыв колокола)"}
        ] 
    },
    { 
        title: "2-я картина: главная партия", 
        file: "mp3/1.2.mp3", 
        timecodes: [
            {time: 0, label: "Гроза, буря, шторм"}, 
            {time: 73, label: "Напор спадает"}, 
            {time: 85, label: "Связующий раздел"}
        ] 
    },
    { 
        title: "3-я картина: побочная партия", 
        file: "mp3/1.3.mp3", 
        timecodes: [
            {time: 0, label: "Внезапный свет (надежда)"}, 
            {time: 112, label: "Диалог двух мелодий"}, 
            {time: 132, label: "Заключительный раздел"}, 
            {time: 154, label: "Переход"}
        ] 
    },
    { 
        title: "4-я картина: разработка", 
        file: "mp3/1.4.mp3", 
        timecodes: [
            {time: 0, label: "Страх и тревога"}, 
            {time: 20, label: "Трепет и сопротивление"}, 
            {time: 55, label: "Накопление энергии"}, 
            {time: 64, label: "Кажется, что должно получиться"}, 
            {time: 74, label: "Кульминация всей первой части"}, 
            {time: 89, label: "Солист взлетает вверх"}, 
            {time: 94, label: "Крах и падение в пропасть"}
        ] 
    },
    { 
        title: "5-я картина: реприза, главная партия", 
        file: "mp3/1.5.mp3", 
        timecodes: [
            {time: 0, label: "Реприза (властная тема)"}, 
            {time: 26, label: "На первый план выходит солист"}, 
            {time: 78, label: "Спуск в безнадежность"}
        ] 
    },
    { 
        title: "6-я картина: реприза, побочная партия", 
        file: "mp3/1.6.mp3", 
        timecodes: [
            {time: 0, label: "Призрачная тема у валторны"}, 
            {time: 35, label: "Кинематографичный переход"}
        ] 
    },
    { 
        title: "7-я картина: кода", 
        file: "mp3/1.7.mp3", 
        timecodes: [
            {time: 0, label: "Подведение итогов"}, 
            {time: 42, label: "Последний вздох (звездочка угасает)"}, 
            {time: 88, label: "Ощущение пути"}, 
            {time: 106, label: "Вновь прорывается энергия"}
        ] 
    },
    { 
        title: "8-я картина: вступление и тема", 
        file: "mp3/2.1.mp3", 
        timecodes: [
            {time: 0, label: "Вступление"}, 
            {time: 50, label: "Хрупкая лирическая тема"}
        ] 
    },
    { 
        title: "9-я картина: разработка", 
        file: "mp3/2.2.mp3", 
        timecodes: [
            {time: 0, label: "Первая попытка взлететь"}, 
            {time: 53, label: "Гребень первой волны"}, 
            {time: 68, label: "Вторая попытка"}, 
            {time: 113, label: "Гребень второй волны"}, 
            {time: 127, label: "Третья попытка (солист без оркестра)"}, 
            {time: 153, label: "Момент прозрения (облегчение)"}
        ] 
    },
    { 
        title: "10-я картина: переход и каденция", 
        file: "mp3/2.3.mp3", 
        timecodes: [
            {time: 0, label: "Прорывается энергия жизни"}, 
            {time: 28, label: "Каденция (перезагрузка)"}
        ] 
    },
    { 
        title: "11-я картина: реприза и кода", 
        file: "mp3/2.4.mp3", 
        timecodes: [
            {time: 0, label: "Реприза"}, 
            {time: 24, label: "Тема у струнных (наша награда)"}, 
            {time: 113, label: "Кода (ощущение полета и свободы)"}
        ] 
    },
    { 
        title: "12-я картина: вступление", 
        file: "mp3/3.1.mp3", 
        timecodes: [
            {time: 0, label: "Жизнерадостное вступление"}, 
            {time: 19, label: "Заносчивая каденция"}
        ] 
    },
    { 
        title: "13-я картина: главная партия", 
        file: "mp3/3.2.mp3", 
        timecodes: [
            {time: 0, label: "Бешеная главная партия"}
        ] 
    },
    { 
        title: "14-я картина: побочная партия", 
        file: "mp3/3.3.mp3", 
        timecodes: [
            {time: 0, label: "Фортепианный переход"}, 
            {time: 14, label: "Новая побочная партия (окрепшая мечта)"}, 
            {time: 112, label: "Очередной переход"}
        ] 
    },
    { 
        title: "15-я картина: разработка", 
        file: "mp3/3.4.mp3", 
        timecodes: [
            {time: 0, label: "Реванш героя"}, 
            {time: 49, label: "Фугато (многослойность)"}, 
            {time: 115, label: "Вершина (главная партия)"}
        ] 
    },
    { 
        title: "16-я картина: реприза, побочная партия", 
        file: "mp3/3.5.mp3", 
        timecodes: [
            {time: 0, label: "Фортепианный переход"}, 
            {time: 16, label: "Побочная партия у солиста"}, 
            {time: 125, label: "Заключительный раздел"}
        ] 
    },
    { 
        title: "17-я картина: кода, вторая разработка", 
        file: "mp3/3.6.mp3", 
        timecodes: [
            {time: 0, label: "Вторая разработка"}, 
            {time: 25, label: "Герой окрылен"}, 
            {time: 65, label: "Последний вздох перед победой"}, 
            {time: 75, label: "Дерзкая каденция (возвращение домой)"}
        ] 
    },
    { 
        title: "18-я картина: кода", 
        file: "mp3/3.7.mp3", 
        timecodes: [
            {time: 0, label: "Синтез (гимн жизни)"}, 
            {time: 52, label: "Финальные титры"}
        ] 
    }
];

        const $ = id => document.getElementById(id);
        const audio = $('audio-engine'), title = $('ui-title'), tBox = $('timecodes-box'),
              btnPlay = $('btn-play'), btnP = $('btn-prev'), btnN = $('btn-next'),
              prog = $('progress'), tm = $('time-display'), tl = $('timeline'),
              ddTrig = $('dropdown-trigger'), ddList = $('dropdown-list');
        
        let curIdx = 0;

        ddList.innerHTML = playlist.map((t, i) => `<div class="drop-item" data-idx="${i}">${t.title}</div>`).join('');

        const loadTrack = i => {
            let t = playlist[i];
            audio.src = t.file; title.textContent = t.title;
            [...ddList.children].forEach((el, j) => el.classList.toggle('active', j === i));
            tBox.innerHTML = t.timecodes.map(tc => `<div class="tc" data-sec="${tc.time}"><span class="tc-time">${Math.floor(tc.time/60)}:${(tc.time%60).toString().padStart(2,'0')}</span>${tc.label}</div>`).join('');
            
            btnP.classList.toggle('disabled', i === 0);
            btnN.classList.toggle('disabled', i === playlist.length - 1);
            prog.style.width = '0%'; tm.textContent = '0:00'; btnPlay.textContent = 'PLAY';
            ddTrig.classList.remove('is-open');
        };

        ddTrig.onclick = e => { e.stopPropagation(); ddTrig.classList.toggle('is-open'); };
        ddList.onclick = e => { let t = e.target.closest('.drop-item'); if(t) { loadTrack(curIdx = +t.dataset.idx); } };
        document.onclick = e => { if(!e.target.closest('.track-selector')) ddTrig.classList.remove('is-open'); };

        btnP.onclick = () => { if(curIdx > 0) { loadTrack(--curIdx); } };
        btnN.onclick = () => { if(curIdx < playlist.length - 1) { loadTrack(++curIdx); } };
        btnPlay.onclick = () => audio.paused ? audio.play() : audio.pause();

        tl.onclick = e => { if(!audio.duration) return; audio.currentTime = (e.clientX - tl.getBoundingClientRect().left) / tl.offsetWidth * audio.duration; if(audio.paused) audio.play(); };
        tBox.onclick = e => { let t = e.target.closest('.tc'); if(t) { audio.currentTime = +t.dataset.sec; audio.play(); } };

        audio.onplay = () => btnPlay.textContent = 'PAUSE';
        audio.onpause = () => btnPlay.textContent = 'PLAY';
        audio.onended = () => btnPlay.textContent = 'PLAY';
        audio.ontimeupdate = () => {
            if(!audio.duration) return;
            prog.style.width = (audio.currentTime / audio.duration * 100) + '%';
            tm.textContent = `${Math.floor(audio.currentTime/60)}:${Math.floor(audio.currentTime%60).toString().padStart(2,'0')}`;
        };

        loadTrack(curIdx);
    </script>
</body>
</html>
